name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [ main ]
  issue_comment:
    types: [ created ]
  pull_request_target:
    types: [ opened, closed, synchronize ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: "recursive"
          fetch-depth: 0

      - name: Setup keys
        env:
          private_key: ${{ secrets.ORG_PRIVATE_KEY }}
          public_key: ${{ secrets.ORG_PUBLIC_KEY }}
        run: |
          if [ -z "$private_key" ] || [ -z "$public_key" ]; then
            echo "Private or public key is not set. Skipping key setup."
          else
            echo "$private_key" | base64 -d > module/private_key
            echo "$public_key" | base64 -d > module/public_key
          fi

      - name: Setup NDK_PATH
        run: echo "NDK_PATH=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV

      - name: Build
        run: |
          make all -j$(nproc)

      - name: Upload release
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/ReZygisk-v*-release.zip"
          archive: false

      - name: Upload debug
        uses: actions/upload-artifact@v7
        with:
          path: "build/out/ReZygisk-v*-debug.zip"
          archive: false

  cla:
    name: "CLA Assistant"
    if: github.event_name == 'issue_comment' || github.event_name == 'pull_request_target'
    permissions:
      actions: write
      contents: write
      pull-requests: write
      statuses: write
    runs-on: ubuntu-latest
    steps:
      - name: "CLA Assistant"
        if: (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') || github.event_name == 'pull_request_target'
        uses: ThePedroo/contributor-assistant@v1.0.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERFORMANC_BOT_ACCESS_TOKEN }}
        with:
          path-to-signatures: 'signatures/ReZygisk/cla.json'
          path-to-document: 'https://github.com/PerformanC/contributing/blob/main/CLA.md'
          branch: 'main'

          remote-organization-name: 'PerformanC'
          remote-repository-name: 'CLA-Signatures'
          create-file-commit-message: 'add: file for storing CLA Signatures'
          signed-commit-message: 'add: @$contributorName to the list of signed contributors in $owner/$repo#$pullRequestNo'
          custom-allsigned-prcomment: 'All Contributors have signed the CLA. The PR is now allowed to be merged.'
