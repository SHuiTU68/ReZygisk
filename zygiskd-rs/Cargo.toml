[package]
name = "rezygiskd"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "ReZygisk daemon (APatch) rewritten in Rust"

[[bin]]
name = "zygiskd"
path = "src/main.rs"

[dependencies]
libc = "0.2"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.dev]
opt-level = 0
